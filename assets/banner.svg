<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="meshCyan" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshPurple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshEmerald" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono-font { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Nebulas (Dynamic / Pulsing) -->
  <circle cx="240" cy="130" r="260" fill="url(#meshCyan)">
    <animate attributeName="r" values="240;290;240" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="240;260;240" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="180" r="280" fill="url(#meshPurple)">
    <animate attributeName="r" values="280;230;280" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cy" values="180;150;180" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="360" r="220" fill="url(#meshEmerald)">
    <animate attributeName="r" values="220;260;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Tech Grid Background Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="6,6" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke-dasharray="6,6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="6,6" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke-dasharray="6,6" />
    <line x1="200" y1="0" x2="200" y2="400" stroke-dasharray="6,6" />
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="6,6" />
    <line x1="600" y1="0" x2="600" y2="400" stroke-dasharray="6,6" />
    <line x1="800" y1="0" x2="800" y2="400" stroke-dasharray="6,6" />
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="6,6" />
  </g>

  <!-- Dynamic / Animated Flow Graphic (Website URL -> AI Neural Engine -> Clean Next.js/React Output) -->
  <g transform="translate(860, 45)" filter="url(#cardShadow)">
    <!-- Node 1: Live Web URL / Screenshot -->
    <g transform="translate(0, 0)">
      <rect width="270" height="64" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.6" />
      <circle cx="28" cy="32" r="8" fill="#0ea5e9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="50" y="27" class="body-font" font-size="12" font-weight="700" fill="#ffffff">TARGET URL / SCREENSHOT</text>
      <text x="50" y="47" class="mono-font" font-size="11" fill="#94a3b8">https://target.site &amp; DOM</text>
    </g>

    <!-- Connector Pulse 1 -->
    <g transform="translate(135, 64)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite" />
      </line>
      <polygon points="-5,32 5,32 0,38" fill="#0ea5e9" />
    </g>

    <!-- Node 2: AI Code Generation Engine -->
    <g transform="translate(0, 102)">
      <rect width="270" height="66" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.6" />
      <circle cx="28" cy="33" r="8" fill="#a855f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="50" y="27" class="body-font" font-size="12" font-weight="700" fill="#ffffff">AI CLONING &amp; SYNTHESIS</text>
      <text x="50" y="48" class="mono-font" font-size="11" fill="#c084fc">LLM Vision + AST Generator</text>
    </g>

    <!-- Connector Pulse 2 -->
    <g transform="translate(135, 168)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite" />
      </line>
      <polygon points="-5,32 5,32 0,38" fill="#a855f7" />
    </g>

    <!-- Node 3: React / Next.js / Tailwind Output -->
    <g transform="translate(0, 206)">
      <rect width="270" height="64" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
      <circle cx="28" cy="32" r="8" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="50" y="27" class="body-font" font-size="12" font-weight="700" fill="#34d399">REACTIVE PRODUCTION APP</text>
      <text x="50" y="47" class="mono-font" font-size="11" fill="#93c5fd">React · Next.js · Tailwind · UI</text>
    </g>
  </g>

  <!-- Left Main Content Area (Crisp Foreground Layer, Never Obscured) -->
  <g transform="translate(60, 50)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="30" rx="15" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="mono-font" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Title Header -->
    <text x="0" y="80" class="title-font" font-size="34" fill="#ffffff" letter-spacing="-0.5">
      Awesome Web Development &amp;
    </text>
    <text x="0" y="124" class="title-font" font-size="38" fill="url(#textGrad)" letter-spacing="-0.5">
      AI Website Cloning 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="body-font" font-size="14.5" fill="#cbd5e1" font-weight="400">
      Open-Source URL-to-Code Cloners, Screenshot-to-UI Synthesizers,
    </text>
    <text x="0" y="188" class="body-font" font-size="14.5" fill="#94a3b8" font-weight="400">
      Modern AI Website Builders &amp; Generative Full-Stack Vibe-Coding Frameworks
    </text>

    <!-- Stat & Feature Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: URL to Code -->
      <g transform="translate(0, 0)">
        <rect width="180" height="52" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#0ea5e9" />
        <text x="14" y="21" class="body-font" font-size="11" font-weight="700" fill="#94a3b8">URL &amp; DOM CLONING</text>
        <text x="14" y="39" class="mono-font" font-size="11" font-weight="600" fill="#38bdf8">Firecrawl &amp; AST</text>
      </g>

      <!-- Pill 2: Screenshot to Code -->
      <g transform="translate(192, 0)">
        <rect width="180" height="52" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#a855f7" />
        <text x="14" y="21" class="body-font" font-size="11" font-weight="700" fill="#94a3b8">VISION TO CODE</text>
        <text x="14" y="39" class="mono-font" font-size="11" font-weight="600" fill="#c084fc">Screenshot-to-UI</text>
      </g>

      <!-- Pill 3: Visual & Generative -->
      <g transform="translate(384, 0)">
        <rect width="180" height="52" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#10b981" />
        <text x="14" y="21" class="body-font" font-size="11" font-weight="700" fill="#94a3b8">VIBE CODING STACK</text>
        <text x="14" y="39" class="mono-font" font-size="11" font-weight="600" fill="#34d399">Bolt / v0 / Lovable</text>
      </g>

      <!-- Pill 4: Production Primitives -->
      <g transform="translate(576, 0)">
        <rect width="180" height="52" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#f59e0b" />
        <text x="14" y="21" class="body-font" font-size="11" font-weight="700" fill="#94a3b8">COMPONENTS &amp; CSS</text>
        <text x="14" y="39" class="mono-font" font-size="11" font-weight="600" fill="#fbbf24">Tailwind &amp; shadcn/ui</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
